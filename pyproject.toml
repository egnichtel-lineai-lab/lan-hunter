[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lan-hunter"
version = "0.1.0"
description = "LAN/IoT device enumeration, MAC/OS fingerprinting and service discovery"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Edwin Gnichtel" }]

[project.scripts]
lan-hunter = "lan_hunter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
